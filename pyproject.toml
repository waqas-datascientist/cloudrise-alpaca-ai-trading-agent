[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudrise-agent"
version = "1.0.0"
description = "Autonomous, defined-risk Alpaca options intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CloudRise"}]
dependencies = []

[project.scripts]
cloudrise = "cloudrise.cli:main"

[tool.setuptools]
packages = ["cloudrise"]

